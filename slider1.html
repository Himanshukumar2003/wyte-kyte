<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.3.5/css/swiper.min.css">
  <title></title>
  <style>
    body {
   background: #2f3640;
}
 .head {
   text-align: center;
   color: #fff;
   margin: 5rem 0;
}
 .head a {
   color: #fff;
}
 .head h3 {
   font-size: 14px;
   font-weight: normal;
}
 .carousel {
   overflow-x: clip;
}
 .swiper {
   padding: 5rem 0;
   overflow: visible;
}
 .rotating-sldier .swiper-slide {
   width: 250px;
}
 .single {
   position: relative;
   pointer-events: none;
   user-select: none;
   box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 1px 0px inset, rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
}
 .single img {
   width: 100%;
   height: auto;
   vertical-align: top;
   border-radius: 8px;
   pointer-events: none;
}
 
  </style>

</head>
<body>
  <div class="head">
<h1>Swiper.js Bend Carousel</h1>
<h3>Made by <a href="https://morenodd.com" target="_blank">morenodd</a></h3>
</div>

<div class="carousel">
  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=1" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=2" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=3" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=4" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=5" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=6" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=7" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=8" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=9" alt="" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="single">
          <img src="https://picsum.photos/800/1200?random=10" alt="" />
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
<script>
  const multiplier = {
    translate: .1,
    rotate: .01
}

new Swiper('.swiper', {
    slidesPerView: 'auto',
    spaceBetween: 90,
    centeredSlides: true,
    loop: true,
    grabCursor: true
})

function calculateWheel() {
    const slides = document.querySelectorAll('.single')
    slides.forEach((slide, i) => {
        const rect = slide.getBoundingClientRect()
        const r = window.innerWidth * .5 - (rect.x + rect.width * .5)
        let ty = Math.abs(r) * multiplier.translate - rect.width * multiplier.translate

        if (ty < 0) {
            ty = 0
        }
        const transformOrigin = r < 0 ? 'left top' : 'right top'
        slide.style.transform = `translate(0, ${ty}px) rotate(${-r * multiplier.rotate}deg)`
        slide.style.transformOrigin = transformOrigin
    })
}

function raf() {
    requestAnimationFrame(raf)
    calculateWheel()
}

raf();
</script>
</body>
</html>
