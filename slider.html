<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipster Slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/drien/jquery-flipster/dist/jquery.flipster.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }

        .flipster {
            width: 100%;
            height: 100%;
        }

        .flipster__arrow {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .flipster__arrow--prev {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .flipster__arrow--next {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        #wheel{
            margin-top: 50px;
        }
        .flip-items li img{
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="wheel">
      <ul class="flip-items">
          <li>
            <img src="img/interior1.png" alt="" />
          </li>
          <li>
            <img src="img/interior2.png" alt="" />
          </li>
          <li>
            <img src="img/interior3.png" alt="" />
          </li>
          <li>
            <img src="img/interior4.png" alt="" />
          </li>
          <li>
            <img src="img/interior5.png" alt="" />
          </li>
          <!-- ----------------- -->
          <li>
            <img src="img/interior1.png" alt="" />
          </li>
          <li>
            <img src="img/interior2.png" alt="" />
          </li>
          <li>
            <img src="img/interior3.png" alt="" />
          </li>
          <li>
            <img src="img/interior4.png" alt="" />
          </li>
          <li>
            <img src="img/interior5.png" alt="" />
          </li>
      </ul>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/drien/jquery-flipster/dist/jquery.flipster.min.js"></script>
    <script>
        $(document).ready(function() {
            var wheel = $("#wheel").flipster({
              style: 'wheel',
              spacing: -0.35,
              loop:true,
              buttons: true,
              scrollwheel: true,
              touch: true,
              arrows: true
            });
        });
    </script>
</body>
</html>
